name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format / Lint / Typecheck / Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: painlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d painlink_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/painlink_test
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier (check)
        run: pnpm format

      - name: ESLint (root)
        run: pnpm lint

      - name: Typecheck (root)
        run: pnpm typecheck

      - name: Mobile unit tests
        run: pnpm --dir apps/mobile test

      - name: Web unit tests
        run: pnpm --dir apps/web test
